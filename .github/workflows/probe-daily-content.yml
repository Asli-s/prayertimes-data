name: Probe daily content

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Call the daily content endpoints
        env:
          AWQAT_USERNAME: ${{ secrets.AWQAT_USERNAME }}
          AWQAT_PASSWORD: ${{ secrets.AWQAT_PASSWORD }}
          PYTHONIOENCODING: utf-8
        run: python -u scripts/probe_daily_content.py
